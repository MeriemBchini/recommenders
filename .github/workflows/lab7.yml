name: Lab7 - deploy and verify
on:
  push:
    branches: [lab7-work, semester-investigation]
    paths: ['lab7/**', '.github/workflows/lab7.yml', 'tensorflow_recommenders/**']

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install TensorFlow (CPU) and TFRS from this fork
        run: |
          python -m pip install --upgrade pip
          pip install tensorflow-cpu==2.15.1 absl-py pytest
          pip install -e . --no-deps

      - name: Evidence - which code is running
        run: |
          echo "Commit SHA: $(git rev-parse HEAD)"
          python -c "import tensorflow_recommenders as t, tensorflow as tf; print('TFRS file:', t.__file__); print('TF:', tf.__version__)"
          python -c "from lab7.recommender_app import recommend; print('RECOMMEND u1 k=3 ->', recommend('u1', 3))"

      - name: Run functional checks
        run: python -m pytest lab7 -v